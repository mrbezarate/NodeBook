version: "3.8"

services:


  brain:
    build: .
    container_name: brain_bot
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Almaty
    volumes:
      - ./base:/app/base
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
