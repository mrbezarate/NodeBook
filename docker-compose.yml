services:
  brain-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daybook-brain-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VAULT_PATH=/app/data
      - RUST_LOG=info
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.toml:/app/config.toml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
